name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

  speech-to-speech-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The STS suite needs no ML stack: the OpenVoice engine is faked and
      # voice profiles come from a temporary SQLite workspace.
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" "sqlalchemy>=2" "pydantic>=2.5" "pytest>=9.0.3,<10" "httpx>=0.27,<1" "yt-dlp>=2026.7.4,<2027"

      - name: Run speech-to-speech tests
        run: python -m pytest backend/tests/sts -q -p no:cacheprovider
